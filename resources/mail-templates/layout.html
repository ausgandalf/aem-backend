<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ APP_NAME }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb;">
                    <!-- Header -->
                    <tr>
                        <td style="background-color:#754f00;padding:24px 32px;text-align:center;">
                            <img src="{{ LOGO_URL }}" alt="WRBLO" height="36" style="height:36px;display:inline-block;border:0;">
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding:32px;font-size:15px;line-height:1.6;color:#1f2937;">
                            {{ CONTENT }}
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#f9fafb;padding:20px 32px;text-align:center;font-size:12px;line-height:1.5;color:#6b7280;border-top:1px solid #e5e7eb;">
                            &copy; {{ YEAR }} WRBLO. All rights reserved.<br>
                            This is an automated message from {{ APP_NAME }}. Please do not reply.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
