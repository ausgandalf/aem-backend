<h1 style="margin:0 0 16px;font-size:20px;color:#111827;">New application submitted</h1>
<p style="margin:0 0 16px;">A new application has been submitted for review.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;font-size:14px;color:#1f2937;">
    <tr>
        <td style="padding:6px 0;color:#6b7280;width:160px;">Applicant</td>
        <td style="padding:6px 0;"><strong>{{ APPLICANT_NAME }}</strong></td>
    </tr>
    <tr>
        <td style="padding:6px 0;color:#6b7280;">Organization</td>
        <td style="padding:6px 0;">{{ ORG_NAME }}</td>
    </tr>
    <tr>
        <td style="padding:6px 0;color:#6b7280;">Project</td>
        <td style="padding:6px 0;">{{ PROJECT_TITLE }}</td>
    </tr>
    <tr>
        <td style="padding:6px 0;color:#6b7280;">Requested amount</td>
        <td style="padding:6px 0;">{{ AMOUNT }}</td>
    </tr>
    <tr>
        <td style="padding:6px 0;color:#6b7280;">Location</td>
        <td style="padding:6px 0;">{{ LOCATION }}</td>
    </tr>
</table>
